name: Tag and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: tagpr
  cancel-in-progress: false

permissions: {}

jobs:
  tagpr:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'tagpr-from-') &&
        (
          startsWith(github.event.label.name, 'tagpr:') ||
          startsWith(github.event.label.name, 'tagpr/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release PR or create tag
        id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN-created tags do not trigger separate tag-push workflows,
  # so invoke the GoReleaser and container publishing workflows explicitly.
  release-go:
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/release-golang.yaml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}

  release-container:
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    uses: ./.github/workflows/build-container-image.yaml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
